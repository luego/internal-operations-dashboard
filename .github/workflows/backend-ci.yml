name: Backend CI

on:
  push:
    branches:
      - main
  pull_request:
    branches:
      - main

permissions:
  contents: read

concurrency:
  group: backend-ci-${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  foundation:
    name: Foundation checks
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - name: Check out repository
        uses: actions/checkout@v7

      - name: Set up .NET from global.json
        uses: actions/setup-dotnet@v6
        with:
          global-json-file: global.json
          cache: true
          cache-dependency-path: "**/packages.lock.json"

      - name: Restore local tools
        run: dotnet tool restore

      - name: Restore packages
        run: dotnet restore InternalOperations.slnx --locked-mode

      - name: Verify formatting
        run: dotnet format InternalOperations.slnx --verify-no-changes --no-restore

      - name: Build
        run: dotnet build InternalOperations.slnx --configuration Release --no-restore -p:ContinuousIntegrationBuild=true

      - name: Test
        run: >-
          dotnet test InternalOperations.slnx
          --configuration Release
          --no-build
          --no-restore
          --filter "Category!=ProviderMatrix"
          --logger "trx;LogFilePrefix=foundation"
          --results-directory TestResults

      - name: Surface foundation test failures
        if: failure()
        run: |
          python3 - <<'PY'
          import glob
          import xml.etree.ElementTree as ET

          for path in glob.glob("TestResults/*.trx"):
              root = ET.parse(path).getroot()
              for result in root.findall(".//{*}UnitTestResult[@outcome='Failed']"):
                  message = result.findtext(".//{*}Message", default="Foundation test failed")
                  stack = result.findtext(".//{*}StackTrace", default="")
                  detail = f"{result.get('testName')}: {message}\n{stack}".replace("%", "%25").replace("\r", "%0D").replace("\n", "%0A")
                  print(f"::error file=.github/workflows/backend-ci.yml,line=47::{detail}")
          PY

      - name: Upload test results
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: foundation-test-results
          path: TestResults/**/*.trx
          if-no-files-found: error
          retention-days: 14

  provider-contracts:
    name: Provider contracts (${{ matrix.provider }})
    needs: foundation
    runs-on: ubuntu-latest
    timeout-minutes: 30

    strategy:
      fail-fast: false
      matrix:
        provider:
          - PostgreSql
          - SqlServer

    steps:
      - name: Check out repository
        uses: actions/checkout@v7

      - name: Set up .NET from global.json
        uses: actions/setup-dotnet@v6
        with:
          global-json-file: global.json
          cache: true
          cache-dependency-path: "**/packages.lock.json"

      - name: Restore packages
        run: dotnet restore InternalOperations.slnx --locked-mode

      - name: Build provider contracts
        run: >-
          dotnet build
          tests/InternalOperations.ProviderContractTests/InternalOperations.ProviderContractTests.csproj
          --configuration Release
          --no-restore
          -p:ContinuousIntegrationBuild=true

      - name: Run ${{ matrix.provider }} contracts
        run: >-
          dotnet test
          tests/InternalOperations.ProviderContractTests/InternalOperations.ProviderContractTests.csproj
          --configuration Release
          --no-build
          --no-restore
          --filter "Category=ProviderMatrix&Provider=${{ matrix.provider }}"
          --logger "trx;LogFileName=provider-${{ matrix.provider }}.trx"
          --results-directory TestResults

      - name: Surface provider test failures
        if: failure()
        run: |
          python3 - <<'PY'
          import glob
          import xml.etree.ElementTree as ET

          for path in glob.glob("TestResults/*.trx"):
              root = ET.parse(path).getroot()
              for result in root.findall(".//{*}UnitTestResult[@outcome='Failed']"):
                  message = result.findtext(".//{*}Message", default="Provider contract failed")
                  stack = result.findtext(".//{*}StackTrace", default="")
                  detail = f"{result.get('testName')}: {message}\n{stack}".replace("%", "%25").replace("\r", "%0D").replace("\n", "%0A")
                  print(f"::error file=.github/workflows/backend-ci.yml,line=101::{detail}")
          PY

      - name: Verify provider test selection
        run: >-
          python3 -c "import glob, xml.etree.ElementTree as ET;
          files = glob.glob('TestResults/*.trx');
          assert files, 'Provider TRX was not created';
          total = sum(len(ET.parse(path).getroot().findall('.//{*}UnitTestResult')) for path in files);
          assert total >= 1, 'Provider filter selected no tests'"

      - name: Upload provider contract results
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: provider-contract-results-${{ matrix.provider }}
          path: TestResults/**/*.trx
          if-no-files-found: error
          retention-days: 14
