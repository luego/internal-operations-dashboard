services:
  database:
    image: postgres:17-alpine
    environment:
      POSTGRES_DB: internal_operations
      POSTGRES_USER: internal_operations
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?Enter the PostgreSQL password through scripts/start-showcase.sh}
    ports:
      - "127.0.0.1:${POSTGRES_PORT:-5432}:5432"
    volumes:
      - internal-operations-postgres:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U internal_operations -d internal_operations"]
      interval: 5s
      timeout: 5s
      retries: 20
    restart: unless-stopped

  migrator:
    build:
      context: .
      dockerfile: Dockerfile
      target: migrations
    command:
      - database
      - update
      - --project
      - src/InternalOperations.Persistence.Migrations.PostgreSql
      - --startup-project
      - src/InternalOperations.Persistence.Migrations.PostgreSql
      - --context
      - ApplicationDbContext
      - --configuration
      - Release
      - --no-build
      - --connection
      - Host=database;Port=5432;Database=internal_operations;Username=internal_operations;Password=${POSTGRES_PASSWORD:?Enter the PostgreSQL password through scripts/start-showcase.sh}
    depends_on:
      database:
        condition: service_healthy
    restart: "no"

  api:
    build:
      context: .
      dockerfile: Dockerfile
      target: runtime
    environment:
      ASPNETCORE_ENVIRONMENT: Development
      Database__Provider: PostgreSql
      ConnectionStrings__PostgreSql: Host=database;Port=5432;Database=internal_operations;Username=internal_operations;Password=${POSTGRES_PASSWORD:?Enter the PostgreSQL password through scripts/start-showcase.sh}
      Authentication__Jwt__Issuer: ${JWT_ISSUER:-internal-operations-api}
      Authentication__Jwt__Audience: ${JWT_AUDIENCE:-internal-operations-web}
      Authentication__Jwt__SigningKey: ${JWT_SIGNING_KEY:?JWT signing key is generated by scripts/start-showcase.sh}
      Authentication__Seed__Enabled: "true"
      Authentication__Seed__AdministratorIdentifier: ${ADMIN_IDENTIFIER:?Enter the administrator email through scripts/start-showcase.sh}
      Authentication__Seed__AdministratorPassword: ${ADMIN_PASSWORD:?Enter the administrator password through scripts/start-showcase.sh}
      Authentication__Seed__AdministratorDisplayName: ${ADMIN_DISPLAY_NAME:-Showcase Administrator}
    ports:
      - "127.0.0.1:${API_PORT:-8080}:8080"
    depends_on:
      migrator:
        condition: service_completed_successfully
    restart: unless-stopped

  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
    environment:
      API_BASE_URL: http://api:8080
      AUTH_JWT_ISSUER: ${JWT_ISSUER:-internal-operations-api}
      AUTH_JWT_AUDIENCE: ${JWT_AUDIENCE:-internal-operations-web}
      AUTH_JWT_SIGNING_KEY: ${JWT_SIGNING_KEY:?JWT signing key is generated by scripts/start-showcase.sh}
      AUTH_COOKIE_SECURE: "false"
    ports:
      - "127.0.0.1:${FRONTEND_PORT:-3000}:3000"
    depends_on:
      - api
    restart: unless-stopped

volumes:
  internal-operations-postgres:
